name: Celestial Parallels

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: main
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'
        cache-dependency-path: 'main/requirements.txt'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Build Executable with PyInstaller
      run: |
        pyinstaller --noconsole --onedir \
          --add-data "Master_Suitability_S.csv${{ matrix.os == 'windows-latest' && ';' || ':' }}." \
          --add-data "C1.csv${{ matrix.os == 'windows-latest' && ';' || ':' }}." \
          --add-data "C2.csv${{ matrix.os == 'windows-latest' && ';' || ':' }}." \
          --add-data "C3.csv${{ matrix.os == 'windows-latest' && ';' || ':' }}." \
          --add-data "C4.csv${{ matrix.os == 'windows-latest' && ';' || ':' }}." \
          --add-data "C5.csv${{ matrix.os == 'windows-latest' && ';' || ':' }}." \
          --add-data "index.html${{ matrix.os == 'windows-latest' && ';' || ':' }}." \
          --add-data "styles.css${{ matrix.os == 'windows-latest' && ';' || ':' }}." \
          --add-data "app.js${{ matrix.os == 'windows-latest' && ';' || ':' }}." \
          desktop_app.py

    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Planetary-Explorer-${{ matrix.os }}
        path: main/dist/
