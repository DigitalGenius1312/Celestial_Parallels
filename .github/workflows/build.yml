name: Celestial Parallels

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Build Executable with PyInstaller
      run: pyinstaller --noconsole --onedir --name "Celestial Parallels" --icon="logo.png" --add-data "Master_Suitability_S.csv${{ matrix.os == 'windows-latest' && ';' || ':' }}." --add-data "C1.csv${{ matrix.os == 'windows-latest' && ';' || ':' }}." --add-data "C2.csv${{ matrix.os == 'windows-latest' && ';' || ':' }}." --add-data "C3.csv${{ matrix.os == 'windows-latest' && ';' || ':' }}." --add-data "C4.csv${{ matrix.os == 'windows-latest' && ';' || ':' }}." --add-data "C5.csv${{ matrix.os == 'windows-latest' && ';' || ':' }}." --add-data "index.html${{ matrix.os == 'windows-latest' && ';' || ':' }}." --add-data "style.css${{ matrix.os == 'windows-latest' && ';' || ':' }}." --add-data "app.js${{ matrix.os == 'windows-latest' && ';' || ':' }}." --add-data "logo.png${{ matrix.os == 'windows-latest' && ';' || ':' }}." desktop_app.py

    - name: Zip Build Folder (Linux/macOS)
      if: runner.os != 'Windows'
      run: cd dist && zip -r ../Celestial-Parallels-${{ matrix.os }}.zip .

    - name: Zip Build Folder (Windows)
      if: runner.os == 'Windows'
      run: Compress-Archive -Path dist\* -DestinationPath Celestial-Parallels-${{ matrix.os }}.zip

    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Celestial-Parallels-${{ matrix.os }}
        path: dist/

    - name: Attach to GitHub Release
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v2
      with:
        files: Celestial-Parallels-${{ matrix.os }}.zip
